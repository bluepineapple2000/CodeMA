# Shared registry of all ESRF_May_2026 scan datasets.
#
# Keys per dataset:
#   raw   — raw HDF5 filename
#   pre   — preprocessed HDF5 filename (or directory prefix for split files)
#   seg   — segmentation HDF5 filename  (segvol.h5)
#   log   — LoG-TIF directory name      (im_seg)
#   dark  — dark-field HDF5 filename

[hdf5_keys]
raw = "instrument/detector_0/data"
pre = "image/data"
seg = "segvol"

[scans.Al]
raw  = "_iris_iris_500_cont.h5"
pre  = "full.h5"
seg  = "segvol.h5"
dark = "_dark.h5"

[scans.Al_big_grains]
raw  = "Al1050_dct7p5_Al1050_dct7p.h5"
seg  = "segvol.h5"
dark = "Al1050_dct7p5_dark.h5"
log  = "im_seg"

[scans.Al_deformed_LoG]
raw  = "A2050_as_annealed_DT_W370_0p12_strain_dct3_A2050_as_annealed_DT_W370_0p12_strain_dct.h5"
pre  = "A2050_as_annealed_DT_W370_0p12_strain_dct3"  # separate files 0000–3599
seg  = "segvol.h5"
dark = "A2050_as_annealed_DT_W370_0p12_strain_dct3_darkend.h5"
log  = "A2050_as_annealed_DT_W370_0p12_strain_dct3/9_forwardrecon/im_seg"

[scans.Al_small_grains]
raw = "iris_dct_450C_0003_iris_dct_450C.h5"
seg = "segvol.h5"
log = "im_seg"

[scans.Cu]
raw = "copper3_dct_load1_redo_other.h5"
seg = "segvol.h5"
log = "im_seg"

[scans.IN718_twins]
raw  = "ep_sync_12_dct_7p5_3_ep_sync_12_dct_7p5.h5"
dark = "ep_sync_12_dct_7p5_3_darkend.h5"
seg  = "segvol.h5"
log  = "im_seg"

[scans.Iron]
raw  = "ind_Iron_dct_load1_z1_ind_Iron_dct_load1_z.h5"
dark = "ind_Iron_dct_load1_z1_darkend.h5"
seg  = "segvol.h5"
log  = "im_seg"

[scans.Iron_deformed]
raw  = "pureIron2_dct_2nd_load_z1_pureIron2_dct_2nd_load_z.h5"
dark = "pureIron2_dct_2nd_load_z1_dark.h5"
seg  = "segvol.h5"
log  = "im_seg"

[scans.Ti7Al]
raw  = "sam_23_dct4_sam_23_dct.h5"
dark = "sam_23_dct4_darkend.h5"
seg  = "segvol.h5"
log  = "im_seg"
