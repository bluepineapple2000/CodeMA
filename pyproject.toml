[project]
name = "code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hdf5plugin>=5.1.0",
    "h5py>=3.11.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "tensorboard>=2.20.0",
    "tqdm>=4.67.3",
    "plotly>=6.8.0",
    "nbformat>=5.10.4",
    "docx>=0.2.4",
    "pandas>=3.0.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
